name: CI

on:
  pull_request:
  push:
    branches: [main, "release/**", "ci/**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-gate:
    name: release gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # The gate has grown past a 15-minute budget on the macOS runner; 40
    # minutes bounds a stalled suite (the no-output kill fires earlier)
    # without canceling a healthy run.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Resolve bun version from packageManager
        id: bun
        # The pin lives in package.json; the workflow never hardcodes it twice.
        # The class admits prerelease suffixes (1.3.14-beta.1) that the old
        # digits-only match dropped, and an empty extraction fails the step
        # instead of installing an unversioned latest (review round 10,
        # edges 6).
        run: |
          version="$(sed -n 's/.*\"packageManager\": \"bun@\([0-9A-Za-z.+-]*\)\".*/\1/p' package.json)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ steps.bun.outputs.version }}
      - name: Install scode (macOS)
        if: runner.os == 'macOS'
        run: brew install bindsch/tap/scode
      - name: Install scode (Linux, from the pinned source)
        if: runner.os == 'Linux'
        # scode is public and supports Linux through bubblewrap. The formula
        # publishes macOS bottles only, so Linux builds the release from
        # source into the runner's user prefix. The source is the commit,
        # not the tag: a tag is mutable, and a moved tag would build
        # unreviewed code under a reviewed name (review round 10,
        # contracts 6). The gate probes one trivial sandboxed command: when
        # bubblewrap cannot create a user namespace on the runner, it prints
        # "scode contract SKIPPED on this runner", which is allowed on Linux
        # only and echoed as a visible warning there (the summary steps grep
        # for it on both platforms); any other probe failure fails the gate.
        env:
          SCODE_TAG: v0.6.6
          # The commit refs/tags/v0.6.6 named when this pin was set.
          SCODE_SHA: 9cbb7f8c995d778589e23d82ad334ab555e209ae
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap
          dir="$(mktemp -d)"
          git clone --quiet --filter=blob:none https://github.com/bindsch/scode.git "$dir/scode"
          git -C "$dir/scode" -c advice.detachedHead=false checkout --quiet "$SCODE_SHA"
          test "$(git -C "$dir/scode" rev-parse HEAD)" = "$SCODE_SHA"
          test "$("$dir/scode/scode" --version)" = "scode ${SCODE_TAG#v}"
          make -C "$dir/scode" install PREFIX="$HOME/.local"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/scode" --version
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Run release gate
        # The wall time lands in gate.log itself, so a slow run is visible
        # in the artifact even when the step fails and the step-level
        # timing in the UI is the only other witness.
        run: |
          set -o pipefail
          start=$(date +%s)
          status=0
          make release-gate 2>&1 | tee gate.log || status=$?
          end=$(date +%s)
          # Printed and appended: visible in the step output even when no
          # artifact is kept (review round 54).
          echo "[gate] release gate wall time: $((end - start)) s" | tee -a gate.log
          exit $status
      - name: Installed-contract summary
        # A gate log with no contract lines at all must fail CI, not pass
        # behind a fallback line that looks like the summary (review
        # round 14, edges 10).
        if: always()
        run: |
          # The gate log exists only once the release gate step started; an
          # earlier failure (bun install) is reported by its own step, not
          # misattributed to the contract printers (review round 28).
          if [ ! -f gate.log ]; then
            echo "::notice::no gate.log: the release gate step did not start"
            exit 0
          fi
          if ! grep -q '^\[contracts\]' gate.log; then
            echo "::error::the release gate log has no [contracts] summary lines"
            exit 1
          fi
          grep '^\[contracts\]' gate.log
      - name: scode must be installed on macOS
        if: runner.os == 'macOS' && always()
        run: |
          if grep -q '^scode contract SKIPPED on this runner' gate.log; then
            echo "::error::macOS runners must install scode (brew install bindsch/tap/scode)"
            exit 1
          fi
      - name: scode skip is visible (Linux)
        # The skip is allowed on Linux (a runner whose kernel refuses user
        # namespaces), but it must not pass silently: the sandboxed
        # contracts did not run, and the summary says so in the log.
        if: runner.os == 'Linux' && always()
        run: |
          if grep -q '^scode contract SKIPPED on this runner' gate.log; then
            echo "::warning::scode skipped on this Linux runner: the sandboxed contracts did not run (bubblewrap could not create a user namespace)"
          fi
